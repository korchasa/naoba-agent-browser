<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Checkout — Example Shop</title>
    <!-- The stand-in page of the store screenshots. Its colours come from
         palette.css, the same file the panel uses. -->
    <link rel="stylesheet" href="palette.css" />
    <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font: 15px/1.55 var(--font-body);
      color: var(--page-text);
      background: var(--page-bg);
    }
    header {
      padding: 18px 32px;
      border-bottom: 1px solid var(--color-divider);
      font-weight: 600;
    }
    main {
      padding: 28px 32px;
      max-width: 620px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }
    p.lede {
      margin: 0 0 22px;
      color: var(--text-dim);
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .total {
      font-weight: 600;
      border-bottom: none;
      padding-top: 16px;
    }
    form {
      display: flex;
      gap: 8px;
      margin: 22px 0 0;
    }
    input {
      flex: 1;
      font: inherit;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-divider);
      background: transparent;
      color: inherit;
    }
    button {
      font: inherit;
      padding: 9px 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--color-accent);
      color: var(--on-accent);
      font-weight: 600;
    }
    .note {
      margin-top: 26px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--color-accent-100);
      color: var(--color-accent-800);
    }
    </style>
  </head>
  <body>
    <header>Example Shop</header>
    <main>
      <h1>Your basket</h1>
      <p class="lede">Two items, ready to check out.</p>
      <div class="row"><span>Mechanical keyboard</span><span>€129.00</span></div>
      <div class="row"><span>Braided cable, 2 m</span><span>€19.00</span></div>
      <div class="row total"><span>Total</span><span>€148.00</span></div>
      <form onsubmit="return false">
        <input placeholder="Discount code" value="SPRING20" />
        <button class="apply">Apply</button>
      </form>
      <div class="note">Sign in to use the card ending 4417.</div>
    </main>
  </body>
</html>
