<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fixture</title>
  </head>
  <body>
    <h1 id="heading">Fixture page</h1>
    <p id="trusted">untested</p>
    <button id="go">Press me</button>
    <input id="field" placeholder="type here" />
    <input id="check" type="checkbox" />
    <select id="picker"><option value="a">A</option><option value="b">B</option></select>
    <form id="search" action="/second.html" method="get">
      <input id="query" name="q" placeholder="search" />
    </form>
    <div id="drag-area" style="width: 200px; height: 80px; background: #eef">drag me</div>
    <p id="drag-report">idle</p>
    <iframe id="inner" src="/inner.html" style="width: 220px; height: 90px; border: 1px solid #999"></iframe>
    <div id="late"></div>
    <a id="link" href="/second.html">second page</a>
    <form id="attach">
      <input id="hidden-file" type="file" style="display: none" />
      <input id="many-files" type="file" title="photos" multiple />
    </form>
    <p id="file-events">none</p>
    <div id="zoomed" style="margin-top: 40px; width: 120px; height: 40px; background: #cfc">zoom target</div>
    <p id="zoomhit">no</p>
    <script>
    document.getElementById('go').addEventListener('click', (event) => {
      document.getElementById('trusted').textContent = 'isTrusted=' + event.isTrusted
    })
    document.getElementById('zoomed').addEventListener('click', () => {
      document.getElementById('zoomhit').textContent = 'yes'
    })
    // A drag is a press, a run of moves, and a release — a page that only sees
    // the first and the last cannot tell a drag from a click.
    let dragStart = null
    let dragMoves = 0
    document.getElementById('drag-area').addEventListener('mousedown', (event) => {
      dragStart = [event.clientX, event.clientY]
      dragMoves = 0
    })
    window.addEventListener('mousemove', () => {
      if (dragStart) dragMoves++
    })
    window.addEventListener('mouseup', (event) => {
      if (!dragStart) return
      const dx = Math.round(event.clientX - dragStart[0])
      document.getElementById('drag-report').textContent = 'dragged ' + dx + 'px in ' + dragMoves + ' moves'
      dragStart = null
    })
    document.getElementById('field').addEventListener('input', (event) => {
      document.title = 'Fixture: ' + event.target.value
    })
    setTimeout(() => {
      const el = document.createElement('div')
      el.id = 'appeared'
      el.textContent = 'here now'
      document.getElementById('late').append(el)
    }, 400)
    window.addEventListener('load', () => {
      fetch('/data.json').then((r) => r.json()).then((d) => {
        document.getElementById('heading').dataset.loaded = d.ok
      })
    })
    // A file placed through the DevTools protocol is only useful if the page
    // hears about it the way it hears about a person picking one: sites react to
    // `change`, not to the value being there.
    const fileEvents = []
    for (const id of ['hidden-file', 'many-files']) {
      for (const kind of ['input', 'change']) {
        document.getElementById(id).addEventListener(kind, (event) => {
          const names = [...event.target.files].map((f) => f.name).join('|')
          fileEvents.push(id + ':' + kind + ':isTrusted=' + event.isTrusted + ':' + names)
          document.getElementById('file-events').textContent = fileEvents.join(', ')
        })
      }
    }
    document.getElementById('link').addEventListener('click', (e) => {
      if (e.isTrusted) document.body.dataset.linkTrusted = 'yes'
    })
    </script>
  </body>
</html>
