<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Inside the walk</title>
  </head>
  <body>
    <p>a frame that moves on its own</p>
    <script>
    // A sub-frame's same-document navigation. `did-navigate-in-page` fires for
    // it on the tab, which is why the recorder has to read `isMainFrame`: an
    // advertisement doing this is not something the person did.
    window.__walkFrame = function () {
      setTimeout(function () {
        history.pushState({}, '', '?frame=moved')
      }, 600)
    }
    </script>
  </body>
</html>
