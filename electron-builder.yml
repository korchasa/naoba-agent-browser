appId: dev.korchasa.Naoba
productName: Naoba
copyright: © korchasa

# Electron names the state directory after `productName` in the bundled
# package.json, not after the bundle, so the name is written into it here and
# ~/Library/Application Support/Naoba is where this copy keeps its sessions.
# The development copy overrides all three of appId, productName and this one
# from `deno task dist dev`, and so gets a directory of its own.
extraMetadata:
  productName: Naoba

directories:
  output: build
  buildResources: build-resources

# Nothing here is run by this application. Until 1.0.4 an IDE launched a relay
# from these two paths — `bridge` before the 1.0.2 rename, `mcp-server` after —
# and those entries live in people's own configuration files, where no update
# reaches them. What ships now is one file that says where MCP went.
extraResources:
  - from: compat/relay-gone.mjs
    to: mcp-server/index.mjs
  - from: compat/relay-gone.mjs
    to: bridge/index.mjs

# Only what the application actually runs.
files:
  - dist/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  # Signing, packaging and upload all happen outside this repository; `dist`
  # produces an unsigned bundle and nothing more.
  identity: null
  target:
    - target: dir
      arch: [arm64]

npmRebuild: false
