appId: dev.korchasa.Naoba
productName: Naoba
copyright: © korchasa

# Electron names the state directory after `productName` in the bundled
# package.json, not after the bundle, so the name is written into it here and
# ~/Library/Application Support/Naoba is where this copy keeps its sessions.
# The development copy overrides all three of appId, productName and this one
# from `deno task dist dev`, and so gets a directory of its own.
extraMetadata:
  productName: Naoba

directories:
  output: build
  buildResources: build-resources

# Only what the application actually runs.
files:
  - dist/**/*
  - package.json

# The bridge rides along, outside the asar, because an IDE launches it with
# `node` and cannot read an archive. Somebody who downloads the application has
# it already: `Naoba.app/Contents/Resources/bridge/index.mjs` is the path their
# MCP configuration points at, and there is nothing else to install or clone.
# It imports node builtins and nothing else, so copying the directory is all it
# takes.
extraResources:
  - from: packages/bridge
    to: bridge

mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  # Signing, packaging and upload all happen outside this repository; `dist`
  # produces an unsigned bundle and nothing more.
  identity: null
  target:
    - target: dir
      arch: [arm64]

npmRebuild: false
