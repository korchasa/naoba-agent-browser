<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Naoba's application icon. The same world with a command prompt that the
       menu bar carries, printed on the face of an instrument: an off-white
       case, a dark dial and one orange — the browser, and the fact that a
       program is what walks it.

       The tile is the macOS grid — a 1024 canvas with the body 824 across —
       and its outline is a superellipse, which is the shape macOS rounds a
       corner with. Regenerate the .icns from this file with:
         for s in 128 256 512 1024; do rsvg-convert -w $s -h $s \
           build-resources/icon.svg -o icon.iconset/icon_...png ; done
         iconutil -c icns icon.iconset -o build-resources/icon.icns
       The three drawings share one geometry and differ only in detail, so 32
       and 64 come from icon-small.svg, which drops the meridians, and 16 from
       icon-tiny.svg, which keeps the chevron alone. electron-builder takes
       the .icns from build-resources itself. -->
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFAF8"/><stop offset="1" stop-color="#E9E6E0"/>
    </linearGradient>
    <clipPath id="face"><circle cx="512" cy="512" r="318"/></clipPath>
  </defs>
